<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EBMP Tracker</title>
<meta name="description" content="EBMP Health & Relationship Weekly Tracker">
<meta name="theme-color" content="#4B0F6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EBMP Tracker">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --ink:#0D1B3E; --ink-2:#3A4563; --muted:#6B7390; --line:#E3E6EE; --line-2:#C9CEDC;
  --navy:#0B2A6B; --red:#C00000; --purple:#4B0F6B; --orange:#ED7D31; --blue:#0033A8; --yellow:#FFC000;
  --health:#1E7F4E; --health-soft:#E4F3EA; --rel:#B0422E; --rel-soft:#FBEAE5;
  --good:#16784A; --good-soft:#E3F4EA; --mid:#A35A10; --mid-soft:#FDF0E2; --zero-soft:#FBE6E6;
  --font:"Raleway", system-ui, -apple-system, "Segoe UI", "Noto Sans Malayalam", sans-serif;
  --r:16px; --t:180ms cubic-bezier(.2,.7,.2,1); --spring:420ms cubic-bezier(.34,1.56,.64,1);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
.app{max-width:620px;margin:0 auto;padding:0 16px calc(100px + env(safe-area-inset-bottom))}
.brandbar{height:6px;background:linear-gradient(90deg,var(--purple) 0 40%,var(--red) 40% 70%,var(--orange) 70% 85%,var(--navy) 85%);margin:0 -16px}
.minibrand{display:flex;justify-content:space-between;align-items:center;padding-top:14px}
.minibrand img{height:26px;width:auto;mix-blend-mode:multiply}
.minibrand span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--purple)}
.kicker{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.title{font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.01em;color:var(--navy)}
.rule{height:4px;width:56px;background:var(--orange);margin-top:10px}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
section{margin-top:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec-h{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;background:var(--red);color:#fff;font-weight:800;font-size:16px;transition:transform var(--t),opacity var(--t)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.navy{background:var(--navy)}
.btn.ghost{background:var(--surface);color:var(--navy);border:1.5px solid var(--line-2)}
.btn.danger{background:var(--surface);color:var(--red);border:1.5px solid var(--line-2)}
.btn.sm{min-height:40px;font-size:14px;width:auto;padding:0 16px;border-radius:12px}
.link{color:var(--blue);font-weight:700;font-size:14px;padding:6px 0}
label.lbl{display:block;font-size:13px;font-weight:800;color:var(--navy);margin:16px 0 7px}
.field{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;font-size:16px;outline:none;transition:border-color var(--t)}
.field:focus{border-color:var(--blue)}
textarea.field{min-height:70px;resize:vertical;line-height:1.45}
.stack{display:grid;gap:10px}
.pct{font-weight:800;border-radius:6px;padding:3px 7px;display:inline-block;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.pct.g{background:var(--good-soft);color:var(--good)} .pct.m{background:var(--mid-soft);color:var(--mid)} .pct.z{background:var(--zero-soft);color:var(--red)}

/* ── splash ── */
.splash{position:fixed;inset:0;z-index:100;background:var(--purple);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px;text-align:center;transition:opacity 380ms ease, visibility 380ms}
.splash.hide{opacity:0;visibility:hidden}
.splash::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 24px)}
.splash>*{position:relative}
.splash .k{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow)}
.splash svg.loader{width:84px;height:84px;margin:22px 0 26px}
.splash .loader circle{fill:none;stroke-width:5;stroke-linecap:round}
.splash .loader .bg{stroke:rgba(255,255,255,.15)}
.splash .loader .fg{stroke:var(--yellow);stroke-dasharray:226;stroke-dashoffset:226;animation:draw 1.3s cubic-bezier(.6,.1,.3,1) forwards;transform:rotate(-90deg);transform-origin:50% 50%}
.splash .loader .fg2{stroke:#FF8A8A;stroke-dasharray:160;stroke-dashoffset:160;animation:draw 1.3s .15s cubic-bezier(.6,.1,.3,1) forwards;transform:rotate(-90deg);transform-origin:50% 50%}
@keyframes draw{to{stroke-dashoffset:0}}
.splash q{display:block;font-size:22px;font-weight:700;line-height:1.35;max-width:22ch;quotes:none;animation:rise 600ms .2s both}
.splash .src{margin-top:12px;font-size:12.5px;font-weight:700;color:#D9C6E6;letter-spacing:.06em;text-transform:uppercase;animation:rise 600ms .35s both}
.splash .tap{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));font-size:12px;color:#C9B4D8}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

/* ── auth ── */
.auth{padding-bottom:30px}
.hero{background:var(--purple);color:#fff;border-radius:18px;padding:22px 20px;margin-top:18px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 22px)}
.hero::after{content:"";position:absolute;right:-28px;top:-28px;width:130px;height:130px;border-radius:50%;border:16px solid rgba(255,192,0,.16)}
.hero>*{position:relative}
.hero .k{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow)}
.hero h1{font-size:30px;font-weight:900;line-height:1.08;margin-top:10px;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:#FFB3B3}
.hero p{margin-top:8px;color:#E9DDF1;font-size:15px}
.pinrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pinrow input{width:100%;min-width:0;text-align:center;font-size:26px;font-weight:800;padding:12px 0;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);outline:none;transition:border-color var(--t),transform var(--t)}
.pinrow input:focus{border-color:var(--blue);transform:translateY(-2px)}
.shake{animation:shake 380ms}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.msg{font-size:14px;min-height:20px;margin-top:10px;color:var(--ink-2)}
.msg.err{color:var(--red);font-weight:600}
.accred{margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
.accred .t{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.accred .logos{display:flex;align-items:center;gap:14px;margin-top:10px}
.accred .ltsu{width:50px;height:50px}
.accred .linc{height:36px;width:auto;border-radius:4px}
.fac{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13.5px;color:var(--ink-2)}
.fac b{color:var(--navy);font-weight:800}
.fac .bar{width:4px;height:30px;background:var(--red);border-radius:2px;flex:none}

/* ── today ── */
.greet{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-top:18px}
.greet h1{font-size:26px;font-weight:900;color:var(--navy);line-height:1.1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:7px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--navy);white-space:nowrap}
.chip.hot{background:#FFF4E5;border-color:#FFD9A8;color:#B4540A}
.chip svg{width:15px;height:15px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border-radius:12px;padding:8px 0 9px;text-align:center;border:1.5px solid transparent;background:var(--surface);transition:all var(--t)}
.day .dn{font-size:11px;font-weight:700;color:var(--muted)}
.day .dd{font-size:18px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.day .dot{width:6px;height:6px;border-radius:50%;margin:4px auto 0;background:var(--line)}
.day .dot.p{background:var(--mid)} .day .dot.f{background:var(--good)}
.day[aria-pressed="true"]{background:var(--navy);border-color:var(--navy)}
.day[aria-pressed="true"] .dn,.day[aria-pressed="true"] .dd{color:#fff}
.day.today:not([aria-pressed="true"]){border-color:var(--red)}
.ringcard{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .h{stroke:var(--health);transition:stroke-dashoffset 600ms cubic-bezier(.2,.7,.2,1)}
.ring .r{stroke:var(--rel);transition:stroke-dashoffset 600ms cubic-bezier(.2,.7,.2,1)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:32px;font-weight:900;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
.ring .c span{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-top:2px}
.legend{display:grid;gap:8px;flex:1;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span.v{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.nudge{display:flex;gap:12px;align-items:center;background:#FFF8E6;border:1px solid #FBE3A6;border-radius:14px;padding:12px 14px;font-size:14px;color:#6A4A00;font-weight:600}
.nudge button{margin-left:auto;font-weight:800;color:var(--blue);white-space:nowrap}
.grp{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:14px 2px 7px;display:flex;align-items:center;gap:8px}
.grp.h{color:var(--health)} .grp.r{color:var(--rel)}
.grp i{width:8px;height:8px;border-radius:2px;background:currentColor}
.list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.list li+li{border-top:1px solid var(--line)}
.item{width:100%;display:flex;align-items:center;gap:14px;padding:14px;text-align:left;min-height:60px;transition:background var(--t)}
.item:active{background:var(--bg)}
.box{width:30px;height:30px;border-radius:9px;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;transition:background var(--t),border-color var(--t)}
.box svg{width:16px;height:16px;color:#fff;opacity:0;transform:scale(.4);transition:opacity var(--t),transform var(--spring)}
.item[aria-checked="true"] .box{background:var(--c);border-color:var(--c)}
.item[aria-checked="true"] .box svg{opacity:1;transform:none}
.item.pop .box{animation:pop 380ms var(--spring)}
@keyframes pop{40%{transform:scale(1.22)}}
.item .lab{flex:1;font-size:16px;font-weight:600;line-height:1.3}
.item .wkc{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.item[disabled]{opacity:.5;cursor:not-allowed}
.closebtn{margin-top:18px}
.closed{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:18px;padding:14px;border-radius:14px;background:var(--good-soft);color:var(--good);font-weight:800}
.quote{border-left:4px solid var(--orange);background:var(--surface);border-radius:0 14px 14px 0;padding:14px 16px}
.quote p{font-size:16px;font-weight:700;color:var(--navy);line-height:1.4}
.quote span{display:block;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

/* ── week grid ── */
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wk{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;text-align:center;transition:border-color var(--t)}
.wk b{display:block;font-size:13px;font-weight:800;color:var(--navy)}
.wk .p{font-size:20px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.wk .p.g{color:var(--good)}
.wk[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.g{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px}
table.g th{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 4px;background:#FAFBFD;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.g th:first-child,table.g td:first-child{text-align:left;padding-left:12px}
table.g td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
table.g td:first-child{font-weight:600;color:var(--ink-2);min-width:180px}
table.g tr.sub td{background:#FAFBFD;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px}
table.g tr.sub.h td{color:var(--health)} table.g tr.sub.r td{color:var(--rel)}
table.g tr.tot td{font-weight:800;color:var(--navy);background:#FAFBFD}
table.g tr:last-child td{border-bottom:0}
.app.wide table.g td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;max-width:150px;overflow:hidden;text-overflow:ellipsis}
@media (min-width:760px){.app.wide table.g td:first-child{max-width:none}}
.cell{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line-2);display:inline-grid;place-items:center;background:var(--surface);transition:all var(--t)}
.cell svg{width:13px;height:13px;color:#fff;opacity:0}
.cell[aria-checked="true"]{background:var(--c);border-color:var(--c)}
.cell[aria-checked="true"] svg{opacity:1}
.cell[disabled]{opacity:.35;cursor:default}

/* ── progress ── */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-size:28px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;font-weight:700;color:var(--muted)}
.spark{width:100%;height:110px;display:block}
.sum{width:100%;border-collapse:collapse;font-size:14.5px}
.sum th{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
.sum th:first-child,.sum td:first-child{text-align:left}
.sum td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--line);font-weight:700}
.sum tr:last-child td{border-bottom:0}
.sum tr.cur td:first-child{color:var(--red)}
.insight{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.insight:first-child{border-top:0;padding-top:2px}
.insight .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:900;font-size:15px}
.insight p{font-size:14.5px;color:var(--ink-2)} .insight b{color:var(--navy)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px 12px;text-align:center;transition:transform var(--t)}
.badge .medal{width:48px;height:48px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--line-2);border:2px dashed var(--line-2)}
.badge .medal svg{width:22px;height:22px}
.badge.on .medal{background:var(--mc);color:#fff;border:0;box-shadow:0 0 0 4px color-mix(in srgb,var(--mc) 18%,transparent)}
.badge b{display:block;font-size:12.5px;font-weight:800;color:var(--navy);line-height:1.2}
.badge span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3}
.badge:not(.on) b{color:var(--muted)}
.formula{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5}

/* ── me ── */
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;flex:none}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow b{display:block;font-weight:700} .setrow span{font-size:13px;color:var(--muted)}
.setrow input[type=time],.setrow input[type=date]{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}

/* ── tabbar ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:620px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
#syncst[data-st="offline"],#syncst[data-st="error"]{color:var(--mid)}
.app.wide{max-width:980px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--navy)}
.tab[aria-current="page"] svg{color:var(--red)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;background:var(--red);border-radius:0 0 3px 3px}

/* ── sheets, toast, confetti ── */
.scrim{position:fixed;inset:0;background:rgba(8,12,30,.45);z-index:40;animation:fade 200ms}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;max-height:92dvh;overflow:auto;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:up 260ms cubic-bezier(.2,.7,.2,1)}
.handle{width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:0 auto 14px}
@keyframes up{from{transform:translateY(50px);opacity:0}}
@keyframes fade{from{opacity:0}}
.celebrate{text-align:center;padding:10px 0 4px}
.celebrate .big{font-size:56px;font-weight:900;color:var(--navy);line-height:1;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:90;max-width:calc(100% - 32px);animation:up 200ms ease}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.preview-img{width:100%;border-radius:14px;border:1px solid var(--line);margin-top:12px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash" class="splash" aria-hidden="true"></div>
<div class="app" id="app"></div>
<div class="tabbar" id="tabbar" hidden></div>
<div id="layer"></div>
<canvas id="confetti"></canvas>
<script>

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const shift = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return key(d); };
const today = () => key(new Date());
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const fmt = (s, o) => parse(s).toLocaleDateString('en-GB', o);
const P = v => Math.round(v * 100) + '%';
const cls = v => v >= GREEN ? 'g' : v > 0 ? 'm' : 'z';
const slug = n => n.trim().toLowerCase().replace(/\s+/g, ' ');
const initials = n => n.split(' ').filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const firstName = n => n.split(' ')[0];
const vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const lineOfDay = (offset = 0) => { const n = diffDays('2026-01-01', today()) + offset; return LINES[((n % LINES.length) + LINES.length) % LINES.length]; };
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast('Could not save on this device'); } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};
async function sha(s){
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch(e){ let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'x' + h.toString(16); }
}

  token:null, role:'participant', mustChange:false, pending:{ days:{}, notes:{} }, sync:'saved', cohort:null, cohortErr:'' };
const isAdmin = () => LIVE && S.role === 'admin';
function needsPin(){ if (LIVE) return S.mustChange; const a = accounts()[S.user]; return !!(a && a.mustChange); }

/* ══════════ CALC ══════════ */
const dateOf = (w, d) => shift(S.D.start, (w - 1) * 7 + d);
const on = (date, id) => !!(S.D.ticks[date] && S.D.ticks[date][id]);
const dayCount = date => ITEMS.filter(i => on(date, i.id)).length;
const grpCount = (date, items) => items.filter(i => on(date, i.id)).length;
const daysDone = (w, id) => [0,1,2,3,4,5,6].filter(d => on(dateOf(w, d), id)).length;
const groupPct = (w, items) => items.reduce((s, i) => s + daysDone(w, i.id), 0) / (items.length * 7);
const endDate = () => dateOf(4, 6);
function currentWeek(){ const n = diffDays(S.D.start, today()); return n < 0 ? 1 : Math.min(4, Math.floor(n / 7) + 1); }
function defaultDay(w){ const t = today(); for (let d = 0; d < 7; d++) if (dateOf(w, d) === t) return d; return dateOf(w, 0) > t ? 0 : 6; }
const isGood = d => dayCount(d) >= GOOD_DAY;
function streak(){ let d = today(); if (!isGood(d)) d = shift(d, -1); let n = 0; while (isGood(d) && d >= S.D.start && n < 400){ n++; d = shift(d, -1); } return n; }
function bestStreak(){ let best = 0, run = 0; for (let d = S.D.start; d <= today() && d <= endDate(); d = shift(d, 1)){ run = isGood(d) ? run + 1 : 0; best = Math.max(best, run); } return best; }
function totalTicks(){ return Object.values(S.D.ticks).reduce((s, t) => s + Object.keys(t).length, 0); }
function activeDays(){ let n = 0; for (let d = S.D.start; d <= today() && d <= endDate(); d = shift(d, 1)) if (dayCount(d)) n++; return n; }
function elapsedDays(){ return Math.max(0, Math.min(28, diffDays(S.D.start, today()) + 1)); }

function ringSvg(date){
  const C = 2 * Math.PI * 50, c2 = 2 * Math.PI * 37;
  const h = grpCount(date, H) / 3, r = grpCount(date, R) / 4;
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="50"/><circle class="h" cx="60" cy="60" r="50" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - h)}"/>
    <circle class="bg" cx="60" cy="60" r="37"/><circle class="r" cx="60" cy="60" r="37" stroke-dasharray="${c2}" stroke-dashoffset="${c2 * (1 - r)}"/></svg>`;
}
function greeting(){ const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
function viewToday(){
  const t = today(), w = S.week, sel = dateOf(w, S.day), future = sel > t, cnt = dayCount(sel), st = streak();
  const before = t < S.D.start, after = t > endDate();
  const yest = shift(t, -1), missedYest = !before && yest >= S.D.start && yest <= endDate() && !dayCount(yest) && sel === t;
  const [q, src] = lineOfDay(1);
  const row = i => `<li><button class="item" role="checkbox" aria-checked="${on(sel, i.id)}" data-act="tick" data-date="${sel}" data-id="${i.id}" ${future ? 'disabled' : ''} style="--c:var(--${i.grp === 'h' ? 'health' : 'rel'})">

  <section><div class="days">${[0,1,2,3,4,5,6].map(d => { const dt = dateOf(w, d), c = dayCount(dt);
    return `<button class="day ${dt === t ? 'today' : ''}" aria-pressed="${d === S.day}" data-act="day" data-d="${d}" aria-label="${fmt(dt, { weekday:'long', day:'numeric', month:'long' })}, ${c} of 7">
      <div class="dn">${DN[d]}</div><div class="dd">${parse(dt).getDate()}</div><div class="dot ${c >= GOOD_DAY ? 'f' : c ? 'p' : ''}"></div></button>`; }).join('')}</div></section>

  <section>
    ${future ? '<p class="small muted">This day hasn’t come yet.</p>' : ''}

    <div class="grp r"><i></i>Relationship</div><ul class="list">${R.map(row).join('')}</ul>

function insights(){
  const t = today(), last = t > endDate() ? endDate() : t, out = [];
  if (last < S.D.start) return out;
  const counts = ITEMS.map(i => { let n = 0, d = S.D.start; for (; d <= last; d = shift(d, 1)) if (on(d, i.id)) n++; return { i, n }; });
  const el = elapsedDays() || 1;
  const best = [...counts].sort((a, b) => b.n - a.n)[0], worst = [...counts].sort((a, b) => a.n - b.n)[0];
  if (best.n) out.push(['#E4F3EA', '#1E7F4E', '↑', `Strongest habit: <b>${esc(best.i.label)}</b>, ${best.n} of ${el} days.`]);
  if (worst.n < el) out.push(['#FBE6E6', '#C00000', '↓', `Needs attention: <b>${esc(worst.i.label)}</b>, ${worst.n} of ${el} days. Make it smaller so it happens daily.`]);
  const wd = [0,1,2,3,4,5,6].map(d => { let s = 0, n = 0; for (let w = 1; w <= 4; w++){ const dt = dateOf(w, d); if (dt <= last){ s += dayCount(dt); n++; } } return n ? s / n : -1; });
  const bd = wd.indexOf(Math.max(...wd)), wkd = wd.indexOf(Math.min(...wd.filter(v => v >= 0)));
  if (wd[bd] > 0 && bd !== wkd) out.push(['#E8EEFB', '#0033A8', '◷', `Best day: <b>${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][bd]}</b>. Toughest: <b>${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][wkd]}</b>. Plan ahead for it.`]);
  const cw = currentWeek();
  if (cw > 1){
    const upto = t > endDate() ? 7 : Math.min(7, diffDays(dateOf(cw, 0), t) + 1);       // compare the same number of days
    const sumW = w => { let x = 0; for (let d = 0; d < upto; d++) x += dayCount(dateOf(w, d)); return x / (upto * 7); };
    const a = sumW(cw), b = sumW(cw - 1), d = Math.round((a - b) * 100);
    out.push(['#FDF0E2', '#A35A10', d >= 0 ? '+' : '–', `Week ${cw} is <b>${d >= 0 ? '+' : ''}${d} points</b> vs week ${cw - 1}${upto < 7 ? (upto === 1 ? ', comparing day 1 of each' : `, comparing the first ${upto} days of each`) : ''}.`]); }
  return out;
}
function spark(){
  const pts = []; for (let i = 0; i < 28; i++){ const d = shift(S.D.start, i); pts.push(d <= today() ? dayCount(d) : null); }
  const W = 560, Hh = 110, px = i => 8 + i * (W - 16) / 27, py = v => Hh - 14 - v / 7 * (Hh - 28);
  let path = '', area = ''; const valid = pts.map((v, i) => [i, v]).filter(p => p[1] != null);
  valid.forEach(([i, v], k) => { path += (k ? 'L' : 'M') + px(i).toFixed(1) + ' ' + py(v).toFixed(1); });
  if (valid.length) area = path + `L${px(valid[valid.length - 1][0]).toFixed(1)} ${Hh - 14}L${px(valid[0][0]).toFixed(1)} ${Hh - 14}Z`;
  const wkLines = [7,14,21].map(i => `<line x1="${px(i - .5)}" x2="${px(i - .5)}" y1="6" y2="${Hh - 14}" stroke="#E3E6EE" stroke-dasharray="3 4"/>`).join('');
  const goal = `<line x1="8" x2="${W - 8}" y1="${py(GOOD_DAY)}" y2="${py(GOOD_DAY)}" stroke="#16784A" stroke-opacity=".35" stroke-dasharray="5 5"/><text x="${W - 10}" y="${py(GOOD_DAY) - 5}" text-anchor="end" font-size="10" font-weight="700" fill="#16784A">streak line 5/7</text>`;
  const dots = valid.map(([i, v]) => `<circle cx="${px(i)}" cy="${py(v)}" r="${v >= GOOD_DAY ? 3.2 : 2.4}" fill="${v >= GOOD_DAY ? '#16784A' : v ? '#ED7D31' : '#C9CEDC'}"/>`).join('');
  const labels = [1,2,3,4].map(w => `<text x="${px((w - 1) * 7 + 3)}" y="${Hh - 1}" text-anchor="middle" font-size="10" font-weight="700" fill="#6B7390">Week ${w}</text>`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Habits done per day over the 4 weeks">${wkLines}${goal}<path d="${area}" fill="#0B2A6B" fill-opacity=".06"/><path d="${path}" fill="none" stroke="#0B2A6B" stroke-width="2" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}

/* ══════════ CONFETTI (one tasteful burst) ══════════ */
function confetti(n = 110){
  if (reduced()) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = ['#4B0F6B','#C00000','#ED7D31','#FFC000','#0B2A6B','#1E7F4E'];
  const ps = Array.from({ length:n }, () => ({ x:innerWidth / 2 + (Math.random() - .5) * 80, y:innerHeight * .42, vx:(Math.random() - .5) * 11, vy:-Math.random() * 12 - 5, s:Math.random() * 6 + 4, r:Math.random() * 6, vr:(Math.random() - .5) * .3, c:cols[Math.floor(Math.random() * cols.length)] }));
  let f = 0;
  (function tick(){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - f / 110); ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (++f < 110) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

}
const pendKey = () => 'ebmp.pending.' + S.user;
function loadPending(){ S.pending = ls.get(pendKey(), { days:{}, notes:{} }); }
function savePending(){ ls.set(pendKey(), S.pending); }
function markDay(date){ if (!LIVE) return; S.D.dayUpd = S.D.dayUpd || {}; S.D.dayUpd[date] = Date.now(); save(); S.pending.days[date] = 1; savePending(); queueSync(); }
function markNote(w){ if (!LIVE) return; S.D.noteUpd = S.D.noteUpd || {}; S.D.noteUpd[w] = Date.now(); save(); S.pending.notes[w] = 1; savePending(); queueSync(); }
let syncT = null, syncing = false;
function queueSync(){ clearTimeout(syncT); setSync('saving'); syncT = setTimeout(syncNow, 700); }
async function syncNow(){
  if (!LIVE || !S.token || S.mustChange) return;
  if (syncing){ queueSync(); return; }
  const dates = Object.keys(S.pending.days), weeks = Object.keys(S.pending.notes);
  if (!dates.length && !weeks.length){ setSync('saved'); return; }
  syncing = true; let changed = false;
  try {
    for (const d of dates){
      const sent = (S.D.dayUpd || {})[d] || Date.now();
      const r = await call('day.save', { date:d, ticks:Object.keys(S.D.ticks[d] || {}), closed_at:S.D.closed[d] || 0, updated_at:sent });
      if (r.conflict){ applyServerDay(r.day); changed = true; }
      if (((S.D.dayUpd || {})[d] || 0) <= sent) delete S.pending.days[d];
    }
    for (const w of weeks){
      const sent = (S.D.noteUpd || {})[w] || Date.now(), n = S.D.notes[w] || {};
      await call('note.save', { week:+w, win:n.win || '', focus:n.focus || '', updated_at:sent });
      if (((S.D.noteUpd || {})[w] || 0) <= sent) delete S.pending.notes[w];
    }
    setSync('saved');
  } catch(e){ setSync(e.code === 'OFFLINE' ? 'offline' : 'error', e.message); }
  finally { syncing = false; savePending(); save(); if (changed) render(); }
}
function setSync(st, msg){ S.sync = st; const el = $('#syncst'); if (el){ el.textContent = syncLabel(); el.title = msg || ''; el.dataset.st = st; } }
function syncLabel(){ return !LIVE ? 'EBMP · Week ' + currentWeek() + ' of 4' : S.sync === 'saving' ? 'Saving…' : S.sync === 'offline' ? 'Offline · will sync' : S.sync === 'error' ? 'Not synced' : 'Saved ✓'; }
function applyServerDay(d){
  const t = {}; (d.ticks || []).forEach(id => t[id] = 1);
  if (Object.keys(t).length) S.D.ticks[d.date] = t; else delete S.D.ticks[d.date];
  if (d.closed_at) S.D.closed[d.date] = d.closed_at; else delete S.D.closed[d.date];
  (S.D.dayUpd ||= {})[d.date] = d.updated_at;
}
function applyBoot(b){
  S.role = b.user.role; S.D.name = b.user.display_name; S.D.start = b.config.start_date;
  if ((b.days || []).length) S.D.onboarded = true;      // already set up on another phone
  (b.days || []).forEach(d => { if (!S.pending.days[d.date] || d.updated_at >= ((S.D.dayUpd || {})[d.date] || 0)){ applyServerDay(d); delete S.pending.days[d.date]; } });
  (b.notes || []).forEach(n => { if (!S.pending.notes[n.week] || n.updated_at >= ((S.D.noteUpd || {})[n.week] || 0)){ S.D.notes[n.week] = { win:n.win, focus:n.focus }; (S.D.noteUpd ||= {})[n.week] = n.updated_at; delete S.pending.notes[n.week]; } });
  ls.set('ebmp.role.' + S.user, S.role); save(); savePending();
}
async function liveLogin(raw, pin){

function cohortStats(u, C){
  const start = C.start_date, t = C.server_today, end = shift(start, C.weeks * 7 - 1), cnt = d => (u.days[d] || [0])[0];
  const wk = n => { let s = 0; for (let i = 0; i < 7; i++){ s += cnt(shift(start, (n - 1) * 7 + i)); } return s / 49; };
  let st = 0, d = t; if (cnt(d) < GOOD_DAY) d = shift(d, -1); while (d >= start && cnt(d) >= GOOD_DAY && st < 400){ st++; d = shift(d, -1); }
  let so = 0, n = 0; for (let x = start; x <= t && x <= end; x = shift(x, 1)){ so += cnt(x); n += 7; }
  const lastTick = Object.keys(u.days).filter(k => u.days[k][0] > 0).sort().pop() || '';
  return { today:cnt(t), closedToday:!!(u.days[t] || [0, 0])[1], streak:st, weeks:[1,2,3,4].map(wk), soFar:n ? so / n : 0, lastTick, inactive: !lastTick || diffDays(lastTick, t) >= 3 };
}

document.addEventListener('submit', async ev => {
  ev.preventDefault(); const f = ev.target.dataset.form;
  if (f === 'login'){
    const raw = $('#un').value.trim(), pin = readPin('p'), sl = slug(raw); S.auth.name = raw;
    if (!raw || pin.length < 4){ Object.assign(S.auth, { msg:'Enter your name and 4-digit PIN.', err:true }); render(); shake('prow'); return; }
    if (LIVE){
      const btn = ev.target.querySelector('button[type=submit]'); if (btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }
      try { await liveLogin(raw, pin); S.auth = { step:'login', name:'', msg:'', err:false, lastPin:pin }; }
      catch(e){ Object.assign(S.auth, { msg:e.message, err:true }); render(); shake('prow'); return; }
      if (S.mustChange){ render(); setTimeout(() => clearPin('n'), 50); return; }
      showSplash(); await liveBoot(); enterApp(); return;
    }
    const A = accounts(); let acc = A[sl];
    if (!acc){
      const rn = ROSTER.find(n => slug(n) === sl);
      if (!rn){ Object.assign(S.auth, { msg:'Name not found. Type it as on the EBMP list, e.g. "Ajmal Ali".', err:true }); render(); shake('prow'); return; }
      if (pin !== TEMP_PIN){ Object.assign(S.auth, { msg:'Wrong PIN. First time? Use the temporary PIN from EBMP.', err:true }); render(); shake('prow'); return; }
      const salt = Math.random().toString(36).slice(2);
      acc = A[sl] = { name:rn, salt, pinHash: await sha(salt + TEMP_PIN), mustChange:true, fails:0, lock:0 }; saveAccounts(A);
      S.auth = { step:'login', name:'', msg:'', err:false }; signIn(sl); render(); setTimeout(() => clearPin('n'), 50); return;
    }
    if ((acc.lock || 0) > Date.now()){ Object.assign(S.auth, { msg:`Too many tries. Wait ${Math.ceil((acc.lock - Date.now()) / 1000)} seconds.`, err:true }); render(); shake('prow'); return; }
    if (await sha(acc.salt + pin) !== acc.pinHash){
      acc.fails = (acc.fails || 0) + 1; if (acc.fails >= 5){ acc.fails = 0; acc.lock = Date.now() + 60000; } saveAccounts(A);
      Object.assign(S.auth, { msg:'Wrong PIN.' + (acc.lock > Date.now() ? ' Locked for 1 minute.' : ''), err:true }); render(); shake('prow'); return;
    }
    acc.fails = 0; acc.lock = 0; saveAccounts(A); S.auth = { step:'login', name:'', msg:'', err:false };
    signIn(sl);
    if (acc.mustChange){ render(); setTimeout(() => clearPin('n'), 50); return; }

  }
  if (f === 'setpin' || f === 'chpin'){

    if (n === TEMP_PIN || /^(\d)\1{3}$/.test(n) || ['1234','4321','0000'].includes(n)){ msg.textContent = 'Pick a less obvious PIN.'; shake('nrow'); clearPin('n'); clearPin('m'); return; }
    if (LIVE){
      const old = f === 'chpin' ? readPin('o') : S.auth.lastPin || TEMP_PIN;
      try { await call('auth.setPin', { old_pin:old, new_pin:n }); } catch(e){ msg.textContent = e.message; shake(f === 'chpin' ? 'orow' : 'nrow'); return; }
      S.mustChange = false;
      if (f === 'chpin'){ S.sheet = null; render(); toast('PIN changed'); return; }
      toast('PIN saved'); await liveBoot(); render(); return;
    }
    if (f === 'chpin' && await sha(acc.salt + readPin('o')) !== acc.pinHash){ msg.textContent = 'Current PIN is wrong.'; shake('orow'); return; }
    acc.salt = Math.random().toString(36).slice(2); acc.pinHash = await sha(acc.salt + n); acc.mustChange = false; saveAccounts(A);

  }

document.addEventListener('click', async ev => {

    }

    case 'testnotif': fireReminder(); break;
    case 'ics': dl('EBMP-daily-reminder.ics', new Blob([ics()], { type:'text/calendar' })); toast('Open the file to add it to your calendar'); break;
    case 'csv': dl(`EBMP-tracker-${slug(S.D.name).replace(/ /g, '-')}-${today()}.csv`, new Blob([csv()], { type:'text/csv;charset=utf-8' })); break;
    case 'backup': dl(`EBMP-tracker-backup-${today()}.json`, new Blob([JSON.stringify(S.D)], { type:'application/json' })); break;
    case 'share': { const cv = shareCanvas(); S.sheet = { type:'share', url:cv.toDataURL('image/png'), cv }; renderLayer(); break; }
    case 'share-go': case 'share-dl': {

      if (a === 'share-go'){ try { const file = new File([blob], name, { type:'image/png' }); if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:'My EBMP week' }); break; } } catch(e){ if (e.name === 'AbortError') break; } }
      dl(name, blob); break;
    }
    case 'chpin': S.sheet = { type:'chpin' }; renderLayer(); setTimeout(() => clearPin('o'), 50); break;
    case 'signout': if (LIVE){ if (Object.keys(S.pending.days).length || Object.keys(S.pending.notes).length){ await syncNow(); if (Object.keys(S.pending.days).length && !confirm('Some ticks haven’t reached the server yet (offline). Sign out anyway? They stay on this phone.')) break; } try { await call('auth.logout'); } catch(e){} localSignOut(); break; }
      ls.del('ebmp.session'); clearTimeout(S.reminderTimer); Object.assign(S, { user:null, D:null, sheet:null, auth:{ step:'login', name:'', msg:'', err:false } }); render(); break;
    case 'c-more': S.showAll = !S.showAll; render(); break;
    case 'c-refresh': S.cohort = null; render(); break;
    case 'c-edit': S.sheet = { type:'cedit', u:el.dataset.u }; renderLayer(); break;
    case 'c-add': S.sheet = { type:'cadd' }; renderLayer(); setTimeout(() => $('#ca_name') && $('#ca_name').focus(), 50); break;
    case 'c-add-go': try { const r = await call('admin.users.add', { display_name:$('#ca_name').value, email:$('#ca_email').value }); S.sheet = null; await loadCohort(); render(); toast('Added. They sign in with their name and PIN ' + r.temp_pin); } catch(e){ toast(e.message); } break;
    case 'c-email': try { await call('admin.users.update', { username:S.sheet.u, email:$('#ce_email').value }); await loadCohort(); renderLayer(); toast('Email saved'); } catch(e){ toast(e.message); } break;
    case 'c-reset': if (!confirm('Reset this PIN to 1221? They will be signed out and set a new PIN.')) break; try { await call('admin.users.resetPin', { username:S.sheet.u }); await loadCohort(); renderLayer(); toast('PIN reset to 1221'); } catch(e){ toast(e.message); } break;
    case 'c-role': case 'c-active': { const u = S.cohort.users.find(x => x.username === S.sheet.u); const patch = a === 'c-role' ? { role:u.role === 'admin' ? 'participant' : 'admin' } : { active:!u.active };
      if (a === 'c-active' && u.active && !confirm('Deactivate ' + u.display_name + '? They can no longer sign in.')) break;
      try { await call('admin.users.update', { username:u.username, ...patch }); await loadCohort(); S.sheet = null; render(); toast('Updated'); } catch(e){ toast(e.message); } break; }
    case 'c-csv': dl(`EBMP-cohort-${today()}.csv`, new Blob([cohortCsv()], { type:'text/csv;charset=utf-8' })); break;
    case 'close': S.sheet = null; renderLayer(); break;
  }
});
document.addEventListener('input', ev => {
  const e = ev.target;
  if (e.dataset.pin){ e.value = e.value.replace(/\D/g, '').slice(-1); if (e.value){ const nx = $('#' + e.dataset.pin + (+e.dataset.i + 1)); if (nx) nx.focus(); else { const form = e.closest('form'); if (form && e.dataset.pin === 'p') form.requestSubmit(); } } }
  if (e.dataset.note){ (S.D.notes[S.week] ||= {})[e.dataset.note] = e.value.slice(0, 500); save(); markNote(S.week); }
});
document.addEventListener('keydown', ev => {
  const e = ev.target;
  if (e.dataset && e.dataset.pin && ev.key === 'Backspace' && !e.value){ const pv = $('#' + e.dataset.pin + (+e.dataset.i - 1)); if (pv){ pv.value = ''; pv.focus(); ev.preventDefault(); } }
  if (ev.key === 'Escape' && S.sheet){ S.sheet = null; renderLayer(); }
});
document.addEventListener('paste', ev => {
  const e = ev.target; if (!e.dataset || !e.dataset.pin) return;
  const d = (ev.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4); if (!d) return; ev.preventDefault();
  [...d].forEach((ch, i) => { const x = $('#' + e.dataset.pin + i); if (x) x.value = ch; });
});
document.addEventListener('change', ev => {
  const e = ev.target;
  if ((e.id === 'c_start' || e.id === 'c_hour') && e.value !== ''){ const d = e.id === 'c_start' ? { start_date:e.value } : { reminder_hour:+e.value }; call('admin.config.save', d).then(() => { toast('Saved'); S.cohort = null; if (d.start_date){ S.D.start = d.start_date; save(); } render(); }).catch(x => toast(x.message)); }
  if (e.id === 'rem' && e.value){ S.D.reminder = e.value; save(); scheduleReminder(); toast('Reminder set for ' + e.value + '. Re-add the calendar alarm if you use it.'); }
  if (e.id === 'st' && e.value){ S.D.start = e.value; save(); S.week = currentWeek(); S.day = defaultDay(S.week); render(); toast(parse(e.value).getDay() === 1 ? 'Start date updated' : 'Updated. Tip: weeks usually start on a Monday'); }
  if (e.id === 'restore' && e.files[0]){
    const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(r.result); if (typeof o.ticks !== 'object' || !o.start) throw 0;
      if (confirm('Replace your data on this phone with this backup?')){ S.D = { ...freshData(S.D.name), ...o, name:S.D.name, start:LIVE ? S.D.start : (o.start || S.D.start), onboarded:true }; save(); if (LIVE){ Object.keys(S.D.ticks).concat(Object.keys(S.D.closed)).forEach(d => markDay(d)); Object.keys(S.D.notes).forEach(w => markNote(w)); } enterApp(); toast('Backup restored'); } }
      catch(x){ toast('That file is not a tracker backup'); } };
    r.readAsText(e.files[0]);
  }
});
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden && LIVE && S.user && !S.mustChange) syncNow(); if (!document.hidden && S.D && today() !== lastDay){ lastDay = today(); S.week = currentWeek(); S.day = defaultDay(S.week); render(); scheduleReminder(); } });

/* ══════════ BOOT ══════════ */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
(function init(){
  if (LIVE){
    const sl = ls.get('ebmp.session', null), tok = ls.get('ebmp.token', null);
    if (sl && tok){ S.user = sl; S.token = tok; S.role = ls.get('ebmp.role.' + sl, 'participant'); S.D = ls.get(dataKey(sl), null); loadPending();
      if (S.D){ showSplash(); if (S.D.onboarded) enterApp(); else render(); liveBoot(); return; } }
    ls.del('ebmp.session'); ls.del('ebmp.token'); showSplash(); render(); return;
  }
  const sl = ls.get('ebmp.session', null), A = accounts();
  if (sl && A[sl] && !A[sl].mustChange){ signIn(sl); if (S.D.onboarded){ showSplash(); enterApp(); return; } render(); return; }
  if (sl && A[sl]){ signIn(sl); }
  showSplash(); render();
})();
</script>
